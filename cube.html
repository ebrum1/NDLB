<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>No Dog Left Behind - the coverage cube explorer</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#15506E;overflow:hidden;
            font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab;}
  body.dragging canvas{cursor:grabbing;}
  body.overslider canvas{cursor:pointer;}
  #hint{position:fixed;right:1.2vw;bottom:1.0vh;color:#7FA0B4;font-size:0.95vh;
        letter-spacing:.06em;opacity:.55;transition:opacity .4s;}
  body.playing #hint{opacity:0;}
</style>
</head>
<body class="playing">
<canvas id="c"></canvas>
<div id="hint">DRAG cube spin &nbsp;·&nbsp; DRAG sliders set values &nbsp;·&nbsp; DOUBLE-CLICK reset view &nbsp;·&nbsp; R reset all &nbsp;·&nbsp; F full screen</div>
<script>
"use strict";
/* ==================================================================
   No Dog Left Behind - the coverage cube, free-spin explorer.
   Standalone, offline.  Companion to NDLB_coverage_cube_animation.html:
   no autoplay and no scene text, just the cube, the four sliders and
   the ball, with left-drag orbit.  The arithmetic is the workshop
   tool's, verbatim, so the two cannot drift apart:

       reach              = min(spatial uniformity, speed, free-roaming)
       effective immunity = reach x vaccine efficacy
       reach marker       = (S, T, D)
       immunity ball      = (S x E, T x E, D x E)
       elimination zone   = the corner where all three axes >= 85
       outcome bands      = 70 and 45

   THE CUBE NEVER CHANGES SIZE.  Its three sides ARE the three axes.
   What moves is the ball inside it.
   ================================================================== */

var C = {
  bg:"#15506E", ink:"#FFFFFF", dim:"#A9C4D4", faint:"#3D7189",
  cream:"#FBEACB", amber:"#E8A33D", ghost:"#2E6B87",
  green:"#5FA023", greenLt:"#8FCC4E", greenDeep:"#3B6D11",
  warn:"#C8881C", red:"#E24B4A", redDeep:"#A32D2D"
};
var LO = 0.85;                       // the elimination-zone corner, as in the tool

var cv=document.getElementById("c"), ctx=cv.getContext("2d"), W=0,H=0,S=1;
function resize(){
  var dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  S=Math.min(W/1600,H/900);
}
window.addEventListener("resize",resize); resize();

var AXES = [
  {k:"S", label:"SPATIAL UNIFORMITY"},
  {k:"T", label:"SPEED & SYNCHRONY"},
  {k:"D", label:"FREE-ROAMING REACH"}
];

function outcome(I){
  if(I>=70) return {c:C.green, label:"Elimination within reach — immunity well above threshold."};
  if(I>=45) return {c:C.warn,  label:"On the edge — elimination only if sustained and uniform for years."};
  return {c:C.red, label:"Outbreaks continue — immunity below the threshold."};
}

var DEFAULTS={S:35,T:30,D:28,E:96};
var st={S:DEFAULTS.S,T:DEFAULTS.T,D:DEFAULTS.D,E:DEFAULTS.E,glow:0};
var tNow=0, started=null;
function lerp(u,v,k){ return u+(v-u)*k; }

/* ---- projection ------------------------------------------------------ */
function project(p,yaw,pitch,cx,cy,unit){
  var x=p[0]-0.5, y=p[1]-0.5, z=p[2]-0.5;      // centre the unit cube on the origin
  var cs=Math.cos(yaw), sn=Math.sin(yaw);
  var x1= x*cs + z*sn, z1= -x*sn + z*cs;
  var cp=Math.cos(pitch), sp=Math.sin(pitch);
  var y1= y*cp - z1*sp, z2= y*sp + z1*cp;
  var k = 9.0/(9.0 + z2*0.55);
  return [cx + x1*unit*k, cy - y1*unit*k, z2];
}
function boxAt(a,b,c,d,e,f){
  return [[a,b,c],[d,b,c],[d,e,c],[a,e,c],[a,b,f],[d,b,f],[d,e,f],[a,e,f]];
}
var FACES=[{i:[4,5,6,7],sh:1.00},{i:[1,2,6,5],sh:0.82},{i:[3,2,6,7],sh:1.22},
           {i:[0,1,2,3],sh:0.62},{i:[0,3,7,4],sh:0.72},{i:[0,1,5,4],sh:0.55}];
var EDGES=[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];

function rgba(hex,f,a){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return "rgba("+Math.round(Math.min(255,r*f))+","+Math.round(Math.min(255,g*f))+","+Math.round(Math.min(255,b*f))+","+a+")";
}
function poly(pts,fill,stroke,lw,dash){
  ctx.save(); if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}
  ctx.restore();
}
function wire(c,col,lw,dash){
  ctx.save(); if(dash) ctx.setLineDash(dash);
  ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.lineCap="round";
  EDGES.forEach(function(e){
    ctx.beginPath(); ctx.moveTo(c[e[0]][0],c[e[0]][1]);
    ctx.lineTo(c[e[1]][0],c[e[1]][1]); ctx.stroke();
  });
  ctx.restore();
}

function drawCube(cx,cy,unit,yaw,pitch,hi){
  var P=function(p){ return project(p,yaw,pitch,cx,cy,unit); };
  var s=st.S/100, t=st.T/100, d=st.D/100, e=st.E/100;
  var reach=Math.min(st.S,st.T,st.D), I=reach*e;
  var oc=outcome(I);
  var ball=[s*e, t*e, d*e];                       // the tool's immunity point
  var inZone = ball[0]>=LO && ball[1]>=LO && ball[2]>=LO;
  st.glow = lerp(st.glow, inZone?1:0, 0.055);
  var G = st.glow;

  // bloom behind the cube once it is glowing
  if(G>0.01 && !window.__noBloom){
    var g=ctx.createRadialGradient(cx,cy,unit*0.15,cx,cy,unit*2.3);
    g.addColorStop(0, rgba(C.green,1,0.30*G));
    g.addColorStop(1, rgba(C.green,1,0));
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }

  var cube = boxAt(0,0,0,1,1,1).map(P);

  // the six faces of the FIXED cube.  They light up green as the ball
  // enters the corner; otherwise they are only faintly there.
  poly([cube[0],cube[1],cube[5],cube[4]], "rgba(255,255,255,0.035)", null, 0);   // the floor
  if(G>0.01){                                    // on glow, the WHOLE cube fills
    var order = FACES.map(function(f){
      return {f:f, z:f.i.reduce(function(a,i){return a+cube[i][2];},0)/4};
    }).sort(function(a,b){ return b.z-a.z; });
    order.forEach(function(o){
      poly(o.f.i.map(function(i){return cube[i];}), rgba(C.green,o.f.sh,0.34*G), null, 0);
    });
  }

  // the cube's edges
  wire(cube, G>0.5 ? rgba(C.greenLt,1,0.45+0.55*G) : rgba(C.ghost,1,0.95),
       Math.max(1,(1.4+1.4*G)*S), G>0.5?null:[6*S,7*S]);

  // the three axis rails, filled to the current value.  These are the sliders.
  var rails=[{k:"S",a:[0,0,0],b:[1,0,0],v:s},
             {k:"T",a:[0,0,0],b:[0,1,0],v:t},
             {k:"D",a:[0,0,0],b:[0,0,1],v:d}];
  rails.forEach(function(R,i){
    var A=P(R.a), Bp=P(R.b);
    var mid=[R.a[0]+(R.b[0]-R.a[0])*R.v, R.a[1]+(R.b[1]-R.a[1])*R.v, R.a[2]+(R.b[2]-R.a[2])*R.v];
    var M=P(mid);
    ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(Bp[0],Bp[1]);
    ctx.strokeStyle=rgba(C.dim,1,0.22); ctx.lineWidth=Math.max(1,5*S); ctx.lineCap="round"; ctx.stroke();
    var hot = (hi===i);
    ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(M[0],M[1]);
    ctx.strokeStyle = hot ? C.cream : rgba(C.green,1.35,0.85);
    ctx.lineWidth=Math.max(1,(hot?7:5)*S); ctx.stroke();
    ctx.beginPath(); ctx.arc(M[0],M[1],(hot?8:5.5)*S,0,6.2832);
    ctx.fillStyle = hot ? C.cream : rgba(C.green,1.35,0.95); ctx.fill();
  });

  // the elimination zone in the far corner
  var ez=boxAt(LO,LO,LO,1,1,1).map(P);
  var ezOrder=FACES.map(function(f){
    return {f:f, z:f.i.reduce(function(a,i){return a+ez[i][2];},0)/4};
  }).sort(function(a,b){ return b.z-a.z; });
  ezOrder.forEach(function(o){
    poly(o.f.i.map(function(i){return ez[i];}), rgba(C.green,o.f.sh,0.10+0.34*G), null, 0);
  });
  wire(ez, rgba(C.green,1.2,0.55+0.45*G), Math.max(1,(1.3+0.9*G)*S));

  // the diagonal from the origin corner to the far corner
  var o0=P([0,0,0]), o1=P([1,1,1]);
  ctx.save(); ctx.setLineDash([4*S,8*S]);
  ctx.beginPath(); ctx.moveTo(o0[0],o0[1]); ctx.lineTo(o1[0],o1[1]);
  ctx.strokeStyle=rgba(C.dim,1,0.20); ctx.lineWidth=Math.max(1,1.2*S); ctx.stroke();
  ctx.restore();

  // the reach marker (where the teams got) and the immunity ball
  var PR=P([s,t,d]), PB=P(ball);
  ctx.save(); ctx.setLineDash([3*S,5*S]);
  ctx.beginPath(); ctx.moveTo(PR[0],PR[1]); ctx.lineTo(PB[0],PB[1]);
  ctx.strokeStyle=rgba(C.dim,1,0.55); ctx.lineWidth=Math.max(1,1.6*S); ctx.stroke();
  ctx.restore();

  var sep=Math.hypot(PR[0]-PB[0],PR[1]-PB[1]);
  ctx.beginPath(); ctx.arc(PR[0],PR[1],9*S,0,6.2832);
  ctx.strokeStyle=rgba(C.dim,1,0.85); ctx.lineWidth=Math.max(1,2.4*S); ctx.stroke();
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.font="bold "+Math.round(11.5*S)+"px Arial, Helvetica, sans-serif";
  if(sep > 46*S){   // otherwise the two labels sit on top of each other
    ctx.fillStyle=rgba(C.dim,1,0.85); ctx.fillText("reach", PR[0], PR[1]-20*S);
  }

  var pulse = 1 + 0.06*Math.sin(tNow*2.6);
  var br = 17*S*pulse;
  var bg2=ctx.createRadialGradient(PB[0]-br*0.3,PB[1]-br*0.35,br*0.1,PB[0],PB[1],br);
  bg2.addColorStop(0, rgba(oc.c,1.55,1)); bg2.addColorStop(1, rgba(oc.c,0.75,1));
  ctx.beginPath(); ctx.arc(PB[0],PB[1],br,0,6.2832);
  ctx.fillStyle=bg2; ctx.fill();
  ctx.strokeStyle=rgba(oc.c,1.6,0.95); ctx.lineWidth=Math.max(1,2*S); ctx.stroke();
  ctx.font="bold "+Math.round(12.5*S)+"px Arial, Helvetica, sans-serif";
  ctx.fillStyle=oc.c;
  ctx.fillText(sep > 46*S ? "effective immunity" : "reach  ·  effective immunity", PB[0], PB[1]+br+26*S);

  // axis names on the three rails
  var anchors={S:[1.20,-0.10,0], T:[-0.16,1.14,0], D:[-0.10,-0.10,1.22]};
  AXES.forEach(function(A,i){
    var q=P(anchors[A.k]);
    var hot=(hi===i);
    ctx.font="bold "+Math.round((12.5+(hot?2:0))*S)+"px Arial, Helvetica, sans-serif";
    ctx.fillStyle = hot ? C.cream : rgba(C.dim,1,0.9);
    ctx.fillText(A.label+"  "+Math.round(st[A.k])+"%", q[0], q[1]);
  });

  return {reach:reach, I:I, oc:oc, inZone:inZone, G:G};
}

/* ---- the four sliders on the left, now live controls ------------------ */
var ui={rects:[], drag:-1, hover:-1};
function sliders(x,y,w,hi){
  var rows=[{k:"S",n:"Spatial uniformity"},{k:"T",n:"Speed & synchrony"},
            {k:"D",n:"Free-roaming reach"},{k:"E",n:"Vaccine efficacy & duration"}];
  ctx.textBaseline="alphabetic";
  ui.rects=[];
  rows.forEach(function(R,i){
    var yy=y+i*52*S, hot=(hi===i), v=st[R.k]/100;
    ctx.textAlign="left";
    ctx.font=(hot?"bold ":"")+Math.round(13.5*S)+"px Arial, Helvetica, sans-serif";
    ctx.fillStyle = hot ? C.cream : rgba(C.dim,1,0.85);
    ctx.fillText(R.n, x, yy);
    ctx.textAlign="right";
    ctx.font="bold "+Math.round(14*S)+"px Arial, Helvetica, sans-serif";
    ctx.fillStyle = hot ? C.cream : C.ink;
    ctx.fillText(Math.round(st[R.k])+"%", x+w, yy);
    var ty=yy+12*S, th=8*S;
    ui.rects.push({k:R.k, i:i, x:x, tx:x, tw:w, y:yy-16*S, w:w, h:44*S});
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,ty,w,th,th/2)
                                   : ctx.rect(x,ty,w,th);
    ctx.fillStyle="rgba(255,255,255,0.10)"; ctx.fill();
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,ty,Math.max(th,w*v),th,th/2)
                                   : ctx.rect(x,ty,w*v,th);
    ctx.fillStyle = R.k==="E" ? rgba(C.amber,1,0.95) : rgba(C.green,1.3,0.95);
    ctx.fill();
    ctx.beginPath(); ctx.arc(x+w*v, ty+th/2, (hot?9:6.5)*S, 0, 6.2832);
    ctx.fillStyle = hot ? C.cream : "#FFFFFF"; ctx.fill();
  });
}
function sliderAt(px,py){
  for(var i=0;i<ui.rects.length;i++){
    var r=ui.rects[i];
    if(px>=r.x-10*S && px<=r.x+r.w+10*S && py>=r.y && py<=r.y+r.h) return i;
  }
  return -1;
}
function setSlider(i,px){
  var r=ui.rects[i];
  st[r.k]=Math.max(0,Math.min(100,(px-r.tx)/r.tw*100));
}

function wrap(text,maxW){
  var w=text.split(" "), lines=[], cur="";
  for(var i=0;i<w.length;i++){
    var tr=cur?cur+" "+w[i]:w[i];
    if(ctx.measureText(tr).width>maxW && cur){ lines.push(cur); cur=w[i]; } else cur=tr;
  }
  if(cur) lines.push(cur);
  return lines;
}

function draw(){
  ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);

  var cx=W*0.715, cy=H*0.50, unit=Math.min(W*0.215,H*0.36);
  // free spin: coast on the released velocity, then let the idle sway fade back in
  if(!view.drag){
    view.yaw+=view.vy; view.pitch=clampPitch(view.pitch+view.vp);
    view.vy*=0.94; view.vp*=0.94;
    if(Math.abs(view.vy)<0.00004) view.vy=0;
    if(Math.abs(view.vp)<0.00004) view.vp=0;
  }
  var swayTarget=(view.drag||view.vy||view.vp)?0:1;
  view.sway+= (swayTarget-view.sway)*(swayTarget<view.sway?0.2:0.008);
  var yaw=view.yaw+view.sway*0.055*Math.sin(tNow*0.19),
      pitch=clampPitch(view.pitch+view.sway*0.035*Math.sin(tNow*0.15+1.1));

  var hi = ui.drag>=0 ? ui.drag : ui.hover;
  var res=drawCube(cx,cy,unit,yaw,pitch,hi);

  if(window.__cubeOnly) return;

  var lx=W*0.068, maxW=W*0.40;

  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  ctx.font="bold "+Math.round(22*S)+"px Arial, Helvetica, sans-serif";
  ctx.fillStyle=C.amber;
  ctx.fillText("NO DOG LEFT BEHIND".split("").join(" "), lx, H*0.135);

  var hs=38;
  ctx.font="bold "+Math.round(hs*S)+"px Arial, Helvetica, sans-serif";
  ctx.fillStyle=C.ink;
  ctx.fillText("The coverage cube", lx, H*0.135+48*S);

  ctx.font=Math.round(16.5*S)+"px Arial, Helvetica, sans-serif";
  ctx.fillStyle=rgba(C.dim,1,1);
  var sy=H*0.135+48*S+24*S;
  var nl=wrap("Rabies vaccination coverage for achieving elimination is 3-dimensional!",maxW);
  nl.forEach(function(l,i){ ctx.fillText(l,lx,sy+i*25*S); });

  sliders(lx, sy+nl.length*25*S+42*S, maxW*0.86, hi);

  // reach / immunity readout and the outcome band
  var ry=H*0.795;
  ctx.textAlign="left"; ctx.textBaseline="alphabetic";
  ctx.font="bold "+Math.round(11.5*S)+"px Arial, Helvetica, sans-serif";
  ctx.fillStyle=rgba(C.dim,1,0.9);
  ctx.fillText("R E A C H   ( W E A K E S T   A X I S )", lx, ry);
  ctx.fillText("E F F E C T I V E   I M M U N I T Y", lx+maxW*0.46, ry);
  ctx.font="bold "+Math.round(38*S)+"px Arial, Helvetica, sans-serif";
  ctx.fillStyle=C.ink; ctx.fillText(Math.round(res.reach)+"%", lx, ry+40*S);
  ctx.fillStyle=res.oc.c; ctx.fillText(Math.round(res.I)+"%", lx+maxW*0.46, ry+40*S);

  ctx.font="bold "+Math.round(14.5*S)+"px Arial, Helvetica, sans-serif";
  ctx.fillStyle=res.oc.c;
  wrap(res.oc.label,maxW).forEach(function(l,i){ ctx.fillText(l, lx, ry+68*S+i*20*S); });

  ctx.font="italic "+Math.round(12*S)+"px Arial, Helvetica, sans-serif";
  ctx.fillStyle="rgba(127,160,180,0.75)";
  ctx.fillText("This is a teaching heuristic, not a model of elimination probability.",
               lx, H-30*S);
}

function frame(ts){
  if(started===null) started=ts;
  tNow=(ts-started)/1000;
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.addEventListener("keydown",function(e){
  if(e.key==="r"||e.key==="R"){
    st.S=DEFAULTS.S; st.T=DEFAULTS.T; st.D=DEFAULTS.D; st.E=DEFAULTS.E;
    view.yaw=0.72; view.pitch=0.34; view.vy=0; view.vp=0;
  }
  else if(e.key==="f"||e.key==="F"){
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
  }
});
document.addEventListener("mousemove",function(){
  document.body.classList.remove("playing");
  clearTimeout(window.__h);
  window.__h=setTimeout(function(){ document.body.classList.add("playing"); },2500);
});

/* ---- pointer plumbing: sliders first, otherwise orbit the cube -------- */
var view={yaw:0.72,pitch:0.34,vy:0,vp:0,drag:false,px:0,py:0,sway:1};
window.__view=view; window.__st=st; window.__ui=ui;
function clampPitch(p){ return Math.max(-1.45,Math.min(1.45,p)); }
cv.addEventListener("pointerdown",function(e){
  if(e.button!==0) return;
  var s=sliderAt(e.clientX,e.clientY);
  if(s>=0){ ui.drag=s; setSlider(s,e.clientX); }
  else{
    view.drag=true; view.px=e.clientX; view.py=e.clientY; view.vy=0; view.vp=0;
    document.body.classList.add("dragging");
  }
  if(cv.setPointerCapture){ try{ cv.setPointerCapture(e.pointerId); }catch(_){ } }
  e.preventDefault();
});
window.addEventListener("pointermove",function(e){
  if(ui.drag>=0){ setSlider(ui.drag,e.clientX); return; }
  if(view.drag){
    var k=0.0062, dx=(e.clientX-view.px)*k, dy=(e.clientY-view.py)*k;
    view.px=e.clientX; view.py=e.clientY;
    view.yaw-=dx; view.pitch=clampPitch(view.pitch-dy);    // the near face follows the pointer
    view.vy=0.65*view.vy-0.35*dx; view.vp=0.65*view.vp-0.35*dy;
    var cap=0.06;
    view.vy=Math.max(-cap,Math.min(cap,view.vy)); view.vp=Math.max(-cap,Math.min(cap,view.vp));
    return;
  }
  var h=sliderAt(e.clientX,e.clientY);
  ui.hover=h;
  document.body.classList.toggle("overslider",h>=0);
});
function endDrag(){ ui.drag=-1; view.drag=false; document.body.classList.remove("dragging"); }
window.addEventListener("pointerup",endDrag);
window.addEventListener("pointercancel",endDrag);
cv.addEventListener("dblclick",function(e){
  if(sliderAt(e.clientX,e.clientY)<0){ view.yaw=0.72; view.pitch=0.34; view.vy=0; view.vp=0; }
});
</script>
</body>
</html>
